server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;  # Путь к статическим файлам приложения
    index index.html;             # Файл приветствия

    location / {
        try_files $uri $uri/ /index.html;  # Для поддержки маршрутизации React
    }

    # Настройка заголовков безопасности (опционально)
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-XSS-Protection "1; mode=block";
    add_header X-Content-Type-Options "nosniff";
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'";
}